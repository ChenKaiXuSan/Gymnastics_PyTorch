# Architecture v1.1 (2026-09-20) of the cycle-aware dual-view fusion model.
# Identical to v1.0 except for the base-pose rule: the scalar reliability
# scales a per-view precision matrix that discounts each view's own
# camera-depth axis (row 2 of its canonicalisation rotation, calibration-free),
#   Lambda_v = w_v (I - depth_alpha d_v d_v^T),
#   P_base   = (Lambda_A + Lambda_B)^-1 (Lambda_A P_A + Lambda_B P_B).
# Encoders, heads, widths and the residual are unchanged (src/fusion/model.py).
name: v1_1
# Common skeleton: "mhr70" (70 joints) or "mhr70_major" (20 major joints).
skeleton: mhr70_major
# Feature width D shared by every branch.
hidden_dim: 128
num_heads: 4
# Feed-forward width relative to hidden_dim.
mlp_ratio: 2.0
dropout: 0.0
samples_per_cycle: ${samples_per_cycle}
# First-sample velocity: "replicate" (copy v[1]) or "zero".
velocity_boundary: replicate

spatial:
  # Transformer blocks over joints (Pose Branch).
  layers: 2

short_motion:
  enabled: true
  layers: 2
  # Fraction of one phase-normalized motion cycle visible to the short branch.
  cycle_ratio: 0.25

long_motion:
  enabled: true
  layers: 2
  # Number of complete motion cycles used as long-range temporal context
  # (defines the training window together with samples_per_cycle).
  num_cycles: ${num_cycles}

phase_encoding:
  # Adds sin(2*pi*h*phi), cos(2*pi*h*phi) for h = 1..harmonics.
  enabled: true
  harmonics: 1

film:
  enabled: true
  # Optional tanh bound on gamma; null = unbounded.
  gamma_bound: null

cross_view:
  enabled: true
  layers: 1

reliability:
  # false = equal weights (up to validity) instead of learned reliability.
  enabled: true

residual:
  enabled: true
  # Bound on |Delta_P| per axis in canonical units (torso lengths); null = unbounded.
  max_delta: 0.25

fusion:
  # Fraction of each view's precision removed along its own depth axis, [0, 1).
  # 0.8 was selected on the FreeMan reference (0.5-0.95 within 0.5 mm, optimum
  # 0.75-0.875); it is a fixed prior, never learned, and must not be tuned on
  # the private triangulated reference (which rewards alpha -> 1 by construction).
  depth_alpha: 0.8
  # Eigenvalue floor of the unit-weight precision sum: caps depth_alpha per
  # frame when the two optical axes are nearly parallel.
  min_precision: 0.5
