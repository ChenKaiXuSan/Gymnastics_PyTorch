# SportsPose sessions from the benchmark SAM3D cache (fusion.data.sportspose).
defaults:
  - _common
name: sportspose
# Converted samples are cached here after the first run.
cache_dir: local/runs/cycle_aware/sample_cache
options:
  benchmark_root: local/runs/sportspose_benchmark
  dataset_root: ${oc.env:GYMNASTICS_PUBLIC_DATASETS_ROOT}/multiview_human/SportsPose
  # S-ids to load (null = every subject; folds via data.fold_json).
  subjects: null
  # Days / activities to load (null = all).
  days: null
  activities: null
  # Records written by `python -m cycle_alignment cycles sportspose` (one clip = one cycle).
  cycle_records_root: local/runs/cycle_records/sportspose
  # Error when a sequence has no record.
  require_cycle_records: true
