# Version-1 objectives (recovery of the clean two-view target), kept for
# reproducing the v1 runs. See src/fusion/losses.py.
recovery:
  weight: 1.0
  kind: smooth_l1
  # pseudo: clean two-view target (label-free); reference: attached reference
  # pose where available (needs data.train_with_reference=true).
  target: pseudo
  beta: 0.05
  consensus_distance: 0.15
position_priors:
  periodicity_weight: 0.1
  bone_symmetry_weight: 0.1
  half_symmetry_weight: 0.0
residual:
  weight: 0.01
  norm: l2

# Version-2 terms, off.
cycle:
  weight: 0.0
  kind: smooth_l1
  beta: 0.05
  external_reference: false
  dead_zone:
    enabled: false
    method: mad
    scale: 1.0
    minimum: 0.0
    maximum: null
reliability:
  weight: 0.0
periodicity:
  weight: 0.0
  type: cosine
  temperature: 0.1
  negative_phase_margin: 0.25
symmetry:
  weight: 0.0
