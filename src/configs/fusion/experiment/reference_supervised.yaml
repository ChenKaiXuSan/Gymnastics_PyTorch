# @package _global_
# Reference-supervised variant of the final architecture (v1.2, loss v4):
# the recovery target is the dataset's own 3D reference instead of the
# label-free equal-weight rule on the clean views.  FreeMan / Fit3D only (the
# private data has no independent reference; its triangulated pseudo-GT must
# never be a training target).  Earlier variants: experiment=archive/reference_supervised_v3
# (v1.1, loss v3) and experiment=archive/reference_supervised_v1 (v1.0, loss v1).
run_name: ${data.name}_${model.name}_reference_supervised_seed${seed}
loss:
  recovery:
    target: reference
data:
  train_with_reference: true
