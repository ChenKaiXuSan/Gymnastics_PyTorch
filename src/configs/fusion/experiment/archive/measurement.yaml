# @package _global_
# (v1 experiment) position-level periodicity plus the half-cycle symmetry prior
# on top of loss=v1_recovery; judged by ROM / peak-velocity retention. Found to
# hurt every metric on the private data (2026-09-20); kept for the record.
defaults:
  - override /model: archive/v1
  - override /loss: archive/v1_recovery
run_name: ${data.name}_${model.name}_measurement_seed${seed}
loss:
  position_priors:
    periodicity_weight: 0.5
    half_symmetry_weight: 0.2
