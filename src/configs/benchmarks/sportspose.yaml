# SportsPose public benchmark (fusion.benchmarks.sportspose).
paths:
  dataset_root: ${oc.env:GYMNASTICS_PUBLIC_DATASETS_ROOT}/multiview_human/SportsPose
  output_root: local/runs/sportspose_benchmark
  sam3d_cache_root: local/runs/sportspose_benchmark/sam3d
  # External per-video SAM3D cache (every camera and frame; produced outside
  # this repository). When set, `cycles sportspose` and the DataModule read it
  # instead of sam3d_cache_root and `infer` is not needed.
  sam3d_derived_root: ${oc.env:GYMNASTICS_DERIVED_ROOT}/sam3d_sportspose
  # Selected face-like / side-like camera per subject and activity.
  views_path: local/runs/sportspose_benchmark/selected_views.json
  sam3d_config: src/configs/pose_estimation/sam3d_body.yaml

dataset:
  # null = every day / subject / activity of the release.
  days: null
  subjects: null
  activities: null
  # Keep every frame_stride-th reference frame (90 fps native -> 30 fps).
  frame_stride: 3

views:
  # View B is the camera closest to this azimuth from view A.
  target_separation_deg: 90.0
  # Error when no camera is within this azimuth of the subject's facing direction.
  max_frontal_deg: 60.0

sam3d:
  device: 0
  # Config hashes accepted as equivalent to paths.sam3d_config.
  identity_aliases: []
