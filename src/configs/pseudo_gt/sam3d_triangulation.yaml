# Triangulate SAM3D-Body 2D keypoints using split_cycle alignment records.

data_root: ${oc.env:GYMNASTICS_DATA_ROOT,/home/data/xchen/gymnastics}

paths:
  sam3d_person_root: ${data_root}/sam3d_body_results/person
  split_cycle_root: local/runs/split_cycle
  output_root: ${data_root}/sam3d_triangulated/person

calibration:
  face: local/runs/calibration_vis/IMG_2420/calibration_parameters.npz
  side: local/runs/calibration_vis/IMG_2676/calibration_parameters.npz

camera_K:
  K:
    - [1710.4629148432577, 0.0, 550.11524355156632]
    - [0.0, 1711.318414718867, 896.8609628805682]
    - [0.0, 0.0, 1.0]
  distortion_coefficients:
    [0.17697328, -0.45675065, -0.0026601, -0.00330938, 0.35538705]
  image_size: [1080, 1920] # (width, height)

# Per-person extrinsics recovered by `python -m triangulation.estimate_extrinsics`.
# Set source to `assumed` to fall back to the synthetic `camera_position` layout
# below, which shares one rig across every person and does not match the data.
extrinsics:
  source: estimated
  path: local/runs/analysis/extrinsics/estimated_extrinsics.json

# Only used when `extrinsics.source: assumed`, and for the camera-pose figures.
camera_position:
  T: [0.0, 0.0, 1.5]
  r: 3.5
  z: 1.5
  yaws:
    1: -90.0
    2: -45.0
    3: 0.0
    4: -135.0

view_camera:
  face: 3
  side: 1

# The 3D preview renders one PNG every `vis_stride` frames and encodes those same
# PNGs into the video, so `fps` must be the source frame rate divided by
# `vis_stride` (30 / 5) for the clip to keep real-time pacing.
visualization:
  save_frames: true
  vis_stride: 5
  make_video: true
  fps: 6
