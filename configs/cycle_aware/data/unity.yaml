# Unity synthetic benchmark (two virtual cameras, native 3D ground truth).
defaults:
  - _common
name: unity
# Converted samples are cached here after the first run.
cache_dir: local/runs/cycle_aware/sample_cache
options:
  benchmark_root: ${oc.env:GYMNASTICS_DATA_ROOT,/home/data/xchen/gymnastics}/unity_benchmark
  sam3d_cache_root: local/runs/unity_benchmark/sam3d
  fps: 60.0
  # Strict direction-transfer fold: "left_to_right" or "right_to_left".
  fold: left_to_right
  # Optional explicit sequence ids (null = every continuous sequence).
  sequences: null
  # Records written by `gymnastics align cycles unity` (cycles + middles).
  cycle_records_root: local/runs/cycle_records/unity
  # Error when a sequence has no record (records with zero cycles are fine).
  require_cycle_records: true
